name: Quality check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLIENT_ID:
        required: true
      CLIENT_SECRET:
        required: true
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format -o none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Write test credentials
        run: |
          printf "const String clientId = '%s';\nconst String clientSecret = '%s';\n" "$CLIENT_ID" "$CLIENT_SECRET" > test/integration/credentials.dart
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Run tests with coverage
        run: dart pub global run coverage:test_with_coverage

      - name: Restore test credentials file
        if: always()
        run: git checkout -- test/integration/credentials.dart

      - name: Check coverage percentage
        id: check_coverage
        run: |
          LINES_FOUND=$(grep -E '^LF:' coverage/lcov.info | awk -F':' '{s+=$2} END {print s}')
          LINES_HIT=$(grep -E '^LH:' coverage/lcov.info | awk -F':' '{s+=$2} END {print s}')
          if [ -z "$LINES_FOUND" ] || [ "$LINES_FOUND" -eq 0 ]; then
            COVERAGE_PERCENTAGE=0.0
          else
            COVERAGE_PERCENTAGE=$(echo "scale=2; ($LINES_HIT / $LINES_FOUND) * 100" | bc -l)
          fi
          echo "Overall coverage: $COVERAGE_PERCENTAGE%"
          if (( $(echo "$COVERAGE_PERCENTAGE < 90.0" | bc -l) )); then
            echo "Code coverage is below 90%! Failing pipeline."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # The pub.dev site uses the analysis tool pana to calculate pub points.
      # This is run automatically on the pub.dev site whenever you publish a new package,
      # or a new version of an existing package.
      - name: Calculate pub points prior to publishing
        run: |
          dart pub global activate pana
          dart pub global run pana --exit-code-threshold 0 --json
